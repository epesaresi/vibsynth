[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibsynth"
version = "2.1.0"
description = "Accelerated vibration test synthesis: Fatigue Damage Spectrum mission synthesis with kurtosis, RMS and PSD control, MMVSD (prescribed kurtosis of the oscillator responses), sine-on-random blocks and non-Gaussian kurtosis control"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Emanuele Pesaresi" }]
license = { text = "MIT" }
keywords = ["vibration", "fatigue damage spectrum", "mission synthesis", "kurtosis", "non-Gaussian", "accelerated testing", "shaker", "sine on random", "time-varying PSD"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
mat73 = ["h5py"]
xlsx = ["openpyxl"]
test = ["pytest", "openpyxl"]

[project.scripts]
vibsynth = "vibsynth.cli:main"

[tool.setuptools]
packages = ["vibsynth", "vibsynth.web"]

[tool.setuptools.package-data]
"vibsynth.web" = ["*.html", "*.css", "*.js"]
