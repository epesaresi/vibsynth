name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib openpyxl pytest
          python -m pip install .
      - name: Run tests
        run: python -m pytest -q tests
      - name: Command line smoke test
        run: python -m vibsynth analyze examples/example_road.mat --fmin 5 --fmax 200 --Q 20 --b 7
      - name: MMVSD smoke test
        run: python -m vibsynth synth examples/example_road.mat --fmin 5 --fmax 100 --method mmvsd --duration 20 --iterations 5 --seed 1 --out mmvsd_smoke.mat
